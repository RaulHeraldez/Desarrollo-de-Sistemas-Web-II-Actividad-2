<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Galería de Productos - Tienda Sara</title>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Tienda Sara</a>
    </div>
</nav>

<div class="container py-5">
    <h2 class="text-center mb-4">Galería de Productos</h2>

    <!-- Filtros -->
    <div class="d-flex justify-content-end mb-3">
        <select class="form-select w-auto">
            <option>Ordenar por</option>
            <option>Precio</option>
            <option>Popularidad</option>
        </select>
    </div>

    <!-- Productos -->
    <div class="row">
        <div class="col-md-3 mb-4">
            <div class="card">
                <img src="img/p1.jpg" class="card-img-top" alt="Producto 1" height="272">
                <div class="card-body text-center">
                    <h6>rosa-sudadera</h6>
                    <p>$1200</p>
                    <button class="btn btn-primary btn-sm">Agregar al carrito</button>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-4">
            <div class="card">
                <img src="img/p2.jpg" class="card-img-top" alt="Producto 2" height="272">
                <div class="card-body text-center">
                    <h6>puma-tenis</h6>
                    <p>$2100</p>
                    <button class="btn btn-primary btn-sm">Agregar al carrito</button>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-4">
            <div class="card">
                <img src="img/p3.jpg" class="card-img-top" alt="Producto 3" height="272">
                <div class="card-body text-center">
                    <h6>cuero-mochila</h6>
                    <p>$600</p>
                    <button class="btn btn-primary btn-sm">Agregar al carrito</button>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-4">
            <div class="card">
                <img src="img/p4.jpg" class="card-img-top" alt="Producto 4" height="272">
                <div class="card-body text-center">
                    <h6>LV-pants</LV-pants></h6>
                    <p>$800</p>
                    <button class="btn btn-primary btn-sm">Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/bootstrap.bundle.js"></script>
</body>
</html>
