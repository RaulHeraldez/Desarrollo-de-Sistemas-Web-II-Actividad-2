<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Inicio - Tienda Sara</title>
</head>
<body>

    <!-- Encabezado -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Tienda Sara</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
                    <li class="nav-item"><a href="galeria.html" class="nav-link">Productos</a></li>
                    <li class="nav-item"><a href="carrito.html" class="nav-link">Carrito</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Banner principal -->
       <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" style="margin-top: 1px;">
           <div class="carousel-inner text-center">
               <div class="carousel-item active">
                    <img src="img/banner.jpg" alt="Banner principal" class="d-block mx-auto" height="450" width="800">
                    </div>
                    <div class="carousel-item">
                    <img src="img/banner2.jpg" alt="Banner secundario" class="d-block mx-auto" height="450" width="800">
                    </div>
                </div>
              </div>

    <!-- Categorías -->
    <section class="py-5 text-center">
        <div class="container">
            <h2 class="mb-4">Categorías Destacadas</h2>
            <div class="row">
                <div class="col-md-4">
                    <div class="card p-3">
                        <img src="img/categoria1.jpg" class="card-img-top" alt="Categoría Ropa" height="170">
                        <h5 class="mt-3">Ropa</h5>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3">
                        <img src="img/categoria2.jpg" class="card-img-top" alt="Categoría Calzado" height="170">
                        <h5 class="mt-3">Calzado</h5>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3">
                        <img src="img/categoria3.jpg" class="card-img-top" alt="Categoría Accesorios" height="170">
                        <h5 class="mt-3">Accesorios</h5>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Productos destacados -->
    <section class="py-5 bg-light text-center">
        <div class="container">
            <h2 class="mb-4">Productos Destacados</h2>
            <div class="row">
                <div class="col-md-3">
                    <div class="card p-3">
                        <img src="img/p1.jpg" class="card-img-top" alt="Producto 1" height="272">
                        <h6 class="mt-2">"rosa-sudadera" </h6>
                        <p>$1200</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3">
                        <img src="img/p2.jpg" class="card-img-top" alt="Producto 2" height="272">
                        <h6 class="mt-2">puma-tenis</h6>
                        <p>$2100</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3">
                        <img src="img/p3.jpg" class="card-img-top" alt="Producto 3" height="272">
                        <h6 class="mt-2">cuero-mochila</h6>
                        <p>$600</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3">
                        <img src="img/p4.jpg" class="card-img-top" alt="Producto 4" height="272">
                        <h6 class="mt-2">LV-pants</h6>
                        <p>$800</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center p-3">
        <p>© 2025 Tienda Sara | Síguenos en redes sociales</p>
    </footer>

    <script src="js/bootstrap.bundle.js"></script>
</body>
</html>
